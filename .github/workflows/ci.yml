name: CI Pipeline

on:
  push:
    branches: ["main", "my_new_ci"]
  pull_request:
    branches: ["main"]

jobs:
  checklist-job:
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Download the files
      uses: actions/checkout@v4

    - name: Step 2 -Check the shopping list rules
      run: |
        echo "Starting automated safety check"
  
      # This command looks for the word 'MILK'. If it is not found this will pass.
        ! grep -i "Milk" shopping_list.txt

      echo "Safety check complete! No illegal items found."  
      
